name: Security Check
on:
  push: { branches: [main, dev, 'feature/**'] }
  pull_request: { branches: [main, dev] }
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=moderate
