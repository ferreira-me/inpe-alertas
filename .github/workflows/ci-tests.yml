name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Se você tem package-lock.json use npm ci; se NÃO tiver, troque para "npm install"
      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      # Cobertura opcional (vira artefato para download)
      - name: Run tests with coverage
        if: ${{ always() }}
        run: npm test -- --coverage

      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
